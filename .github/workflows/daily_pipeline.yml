name: FPL Daily Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run FPL ingestion pipeline
        run: python -m ingestion.run_pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Run dbt
        working-directory: dbt/fpl_edge
        run: dbt build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}