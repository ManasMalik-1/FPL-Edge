name: FPL Daily Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run FPL ingestion pipeline
        run: python -m ingestion.run_pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Create dbt profile
        working-directory: dbt/fpl_edge
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p ~/.dbt

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["DATABASE_URL"]
          parsed = urlparse(url)

          with open(os.path.expanduser("~/.dbt/profiles.yml"), "w") as f:
              f.write(f"""fpl_edge:
            target: dev
            outputs:
              dev:
                type: postgres
                host: {parsed.hostname}
                user: {parsed.username}
                password: {parsed.password}
                port: {parsed.port or 5432}
                database: {parsed.path.lstrip("/")}
                schema: analytics
                threads: 1
          """)

          print("dbt profile created successfully")
          PY

      - name: Run dbt
        working-directory: dbt/fpl_edge
        run: dbt build