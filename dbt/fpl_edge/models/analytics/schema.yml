version: 2

models:

  - name: fixture_difficulty
    columns:
      - name: fixture_id
        data_tests:
          - not_null
          - unique

      - name: gameweek
        data_tests:
          - not_null

      - name: team_h
        data_tests:
          - not_null

      - name: team_a
        data_tests:
          - not_null

      - name: kickoff_time
        data_tests:
          - not_null

  - name: player_performance
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

      - name: fixtures_played
        data_tests:
          - not_null

      - name: minutes
        data_tests:
          - not_null

      - name: total_points
        data_tests:
          - not_null

      - name: points_per_match
        data_tests:
          - not_null

  - name: player_value
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

      - name: player_name
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: points_per_million
        data_tests:
          - not_null

  - name: player_fixture_context
    columns:
      - name: player_id
        data_tests:
          - not_null

      - name: fixture_id
        data_tests:
          - not_null

  - name: player_recommendations
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique

      - name: player_name
        data_tests:
          - not_null

      - name: recommendation_score_rounded
        data_tests:
          - not_null